<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egor</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#f3f4fb;--panel:#fff;--text:#16182b;--muted:#7a7f9a;--line:#e4e6f2;--brand:#5b5bf0;--brand2:#8b4be8;--their:#eceefa;--ok:#22c55e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0e0f1a;--panel:#171829;--text:#eef0ff;--muted:#8d92b0;--line:#26283f;--their:#23253d}}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:var(--their);color:var(--text);padding:9px 13px;transition:transform .12s,filter .15s,background .15s}
button:hover{filter:brightness(1.12)}button:active{transform:scale(.93)}
button.p{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--text);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,91,240,.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,75,232,.7)}100%{box-shadow:0 0 0 28px rgba(139,75,232,0)}}
@keyframes grad{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#auth{height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#5b5bf0,#8b4be8,#3b82f6);background-size:300% 300%;animation:grad 12s ease infinite;padding:16px}
#auth .box{background:var(--panel);border-radius:20px;padding:26px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;animation:pop .4s ease-out}
#auth img{width:72px;height:72px;border-radius:18px;align-self:center}#auth h1{margin:0;text-align:center}
.tabs{display:flex;gap:6px}.tabs button{flex:1}.tabs .on{background:var(--brand);color:#fff}
#aerr{color:#e5484d;min-height:20px;font-size:14px}
#app{display:none;height:100dvh;width:100%;background:var(--panel);animation:fade .4s}
#side{width:360px;max-width:40%;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:280px}
.brand{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:700;font-size:20px}
.brand>img{width:34px;height:34px;border-radius:9px}.brand>span{flex:1}.brand button{padding:6px 10px;font-size:14px;background:rgba(0,0,0,.28);color:#fff}
#addrow{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
#list{overflow:auto;flex:1}
.ct{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .15s,padding-left .15s}
.ct:hover{background:var(--their);padding-left:20px}.ct.on{background:var(--their)}
.ct .w{flex:1;min-width:0}.ct .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;position:relative;background:linear-gradient(135deg,var(--brand),var(--brand2)) center/cover;transition:transform .2s}
.av.sm{width:36px;height:36px;font-size:14px;cursor:pointer;border:2px solid rgba(255,255,255,.7)}.av.sm:hover{transform:scale(1.1)}
.av.big{width:120px;height:120px;font-size:48px}.av.ring{animation:pulse 1.4s infinite}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.nm{font-weight:600}.sub{color:var(--muted);font-size:13px}
.bd{background:var(--brand);color:#fff;border-radius:11px;padding:1px 8px;font-size:12px;font-weight:700;animation:pop .25s}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:64px}
#head .t{flex:1;min-width:0}#back{display:none}
#msgs{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:6px;background:var(--bg);scroll-behavior:smooth}
.m{max-width:70%;padding:8px 12px;border-radius:18px 18px 18px 4px;background:var(--their);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap}
.m.me{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;align-self:flex-end;border-radius:18px 18px 4px 18px}
.m.new{animation:pop .25s ease-out}
.m small{display:block;color:var(--muted);font-size:12px}.m.me small{color:#e4e4ff}
.m img{display:block;max-width:100%;max-height:340px;border-radius:12px;cursor:zoom-in;margin-bottom:4px;transition:transform .2s}.m img:hover{transform:scale(1.02)}
#bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
#bar button.ic{font-size:20px;padding:7px 11px}
.empty{margin:auto;color:var(--muted);text-align:center;animation:fade .5s}
#call{position:fixed;inset:0;background:rgba(10,10,25,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;z-index:9;animation:fade .25s}
#call video{max-width:92vw;max-height:60vh;border-radius:14px;background:#000}
#lv{width:130px;position:absolute;right:16px;bottom:100px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:10;cursor:zoom-out;animation:fade .2s}
#lb img{max-width:94vw;max-height:94vh;border-radius:10px;animation:pop .25s}
@media (max-width:700px){#side{width:100%;max-width:100%}#main{display:none}#app.chat #side{display:none}#app.chat #main{display:flex}#back{display:inline-block}.m{max-width:85%}}

.av.prem{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #f5b301}
.brand{gap:6px}.brand button{padding:6px 8px}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:8;animation:fade .2s}
#mod .card{background:var(--panel);border-radius:18px;padding:18px;width:min(580px,94vw);max-height:88vh;overflow:auto;animation:pop .25s}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:8px}
.sec{font-weight:700;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.gift,.gcard{border-radius:14px;padding:10px;text-align:center;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.gift{cursor:pointer;transition:transform .15s}.gift:hover{transform:translateY(-3px) scale(1.04)}
.gift .e,.gcard .e{font-size:44px;line-height:1.2}.gift img,.gcard img{width:64px;height:64px;border-radius:12px;object-fit:cover;margin:0!important;max-height:none!important}
.gcard{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:140px;animation:pop .4s}
.num{font-size:11px;color:var(--muted)}
.r1{background-image:linear-gradient(135deg,#3b82f633,#06b6d433)}.r2{background-image:linear-gradient(135deg,#8b5cf655,#ec489944)}
.r3{background-image:linear-gradient(135deg,#f59e0b66,#ef444444);box-shadow:0 0 16px #f59e0b66}
.hero{text-align:center;padding:10px}.hero .e{font-size:56px;animation:pulse 2s infinite;border-radius:50%;display:inline-block}
.perk{padding:7px 10px;border-radius:10px;background:var(--their);margin:5px 0}
.sw{display:flex;gap:8px;flex-wrap:wrap}.swb{width:36px;height:36px;border-radius:50%!important;padding:0!important}
.form{display:flex;flex-direction:column;gap:8px}.form select{font:inherit;padding:10px;border-radius:10px;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.form label{display:flex;gap:8px;align-items:center}.form label input{width:auto}
.row{display:flex;gap:8px;align-items:center;margin:4px 0}.row span{flex:1}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:14px;z-index:20;animation:pop .3s;box-shadow:0 8px 30px rgba(0,0,0,.4)}

.cel{position:fixed;inset:0;z-index:30;background:radial-gradient(circle,rgba(0,0,0,.5),rgba(0,0,0,.88));display:grid;place-items:center;animation:fade .3s;overflow:hidden;cursor:pointer}
.cbox{background:var(--panel);color:var(--text);border-radius:26px;padding:30px 44px;text-align:center;animation:boom .8s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 70px #8b4be8aa;max-width:90vw}
.cbox.r3{box-shadow:0 0 100px #f59e0b}.cbox h2{margin:8px 0 4px}
.cbox .e{font-size:100px;animation:spin 1.2s ease-out,floaty 2s ease-in-out 1s infinite}
.cbox img{width:130px;height:130px;border-radius:22px;object-fit:cover;animation:spin 1.2s ease-out,floaty 2s ease-in-out 1s infinite}
@keyframes boom{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes spin{from{transform:rotateY(720deg) scale(.2)}to{transform:none}}
@keyframes floaty{50%{transform:translateY(-12px)}}
.cf{position:absolute;top:-40px;font-size:26px;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
body{transition:transform .8s,filter .5s}
html.tr-flip body{transform:rotate(180deg)}
html.tr-shake body{animation:shake .4s infinite}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-8px,4px) rotate(-.6deg)}50%{transform:translate(8px,-4px) rotate(.6deg)}75%{transform:translate(-6px,-3px)}}
html.tr-rainbow body{animation:hue 1.5s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
html.tr-big body{zoom:1.6}html.tr-small body{zoom:.65}html.tr-blur body{filter:blur(5px)}
.tover{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;color:#fff;background:rgba(10,10,25,.94);font-size:26px;animation:fade .3s;padding:20px}
.tover small{position:absolute;bottom:20px;opacity:.7;font-size:13px}
.tover.siren{animation:siren .5s infinite alternate}@keyframes siren{from{background:rgba(200,0,0,.92)}to{background:rgba(0,40,200,.92)}}
</style>
</head>
<body>
<div id="auth"><div class="box">
 <img src="logo.png" alt="Egor"><h1>Egor</h1>
 <div class="tabs"><button id="tl" class="on">Вход</button><button id="tr">Регистрация</button></div>
 <input id="au" placeholder="Юзернейм" autocomplete="username">
 <input id="ae" type="email" placeholder="Почта" style="display:none" autocomplete="email">
 <input id="ap" type="password" placeholder="Пароль" autocomplete="current-password">
 <div id="aerr"></div><button class="p" id="ago">Войти</button>
</div></div>

<div id="app">
 <aside id="side">
  <div class="brand"><img src="logo.png" alt=""><span>Egor</span><button id="plus" title="Косухость+">⭐</button><button id="shop" title="Магазин и коллекция">🛍️</button><button id="adm" title="Панель админа" style="display:none">🛡️</button><button id="mute" title="Звуки">🔔</button><span id="meav" style="flex:none" title="Сменить аватарку"></span><button id="out" title="Выйти">⏻</button></div>
  <div id="addrow"><input id="addu" placeholder="Добавить друга по юзернейму"><button class="p" id="addb">+</button></div>
  <div id="list"></div>
 </aside>
 <section id="main">
  <div id="head"><button id="back">←</button><span id="hav"></span><div class="t"><div class="nm" id="title">Выбери чат</div><div class="sub" id="st"></div></div>
   <button id="gf" title="Подарки">🎁</button><button id="ca">📞</button><button id="cv">🎥</button></div>
  <div id="msgs"><div class="empty">Добавь друга по юзернейму и начни общение</div></div>
  <div id="bar"><button class="ic" id="att" title="Отправить фото">🖼️</button><input id="txt" placeholder="Сообщение…" autocomplete="off"><button class="p" id="send">Отправить</button></div>
 </section>
</div>
<input type="file" id="fimg" accept="image/*" hidden><input type="file" id="fav" accept="image/*" hidden>
<div id="lb"><img alt=""></div>
<div id="mod"><div class="card"></div></div>
<div id="call"><div id="cav"></div><div id="cs" style="font-size:20px"></div><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>
 <div><button class="p" id="acc" style="display:none">Принять</button> <button id="end" style="background:#e5484d;color:#fff">Завершить</button></div></div>

<script type="module">
import firebaseConfig from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,addDoc,deleteDoc,collection,query,where,orderBy,limitToLast,onSnapshot,getDocs,updateDoc,writeBatch,increment} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const DOMAIN='@egor.app';
let mode='login',registering=false,uid=null,me=null,friends=new Map(),seen={},avs={},last={},unread={},cur=null,msgs=[],unMsgs=null,shown=0;
const presUn={},lastUn={},boot=Date.now();
const ckey=o=>[uid,o].sort().join('_');
let prem={},cat={},cols={},myGifts=[];
const isPrem=id=>(prem[id]||0)>Date.now();
const isOn=f=>seen[f]&&Date.now()-seen[f]<50000;
const prev=x=>x?(x.from===uid?'Вы: ':'')+(x.img&&!x.text?'📷 Фото':x.text):'';
const avEl=(id,name,cls='')=>{const d=el('div','av '+cls,avs[id]?'':(name||'?')[0].toUpperCase());if(avs[id])d.style.backgroundImage=`url(${avs[id]})`;if(isPrem(id))d.classList.add('prem');return d};

/* ---- звуки (генерируются в браузере) ---- */
let ac,muted=false;try{muted=localStorage.getItem('egor_mute')==='1'}catch(e){}
const ctx=()=>ac||(ac=new(window.AudioContext||window.webkitAudioContext)());
document.addEventListener('click',()=>{try{ctx().resume()}catch(e){}});
function tone(f,t0,d,v=.15){if(muted)return;try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);
 const s=c.currentTime+t0;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.05)}catch(e){}}
const snd={send:()=>{tone(660,0,.12,.1);tone(880,.07,.14,.1)},recv:()=>{tone(880,0,.15,.15);tone(1175,.1,.28,.15)},
 ring:()=>{[0,.4].forEach(x=>{tone(740,x,.25,.22);tone(988,x+.12,.25,.22)})},back:()=>tone(440,0,.9,.08),end:()=>{tone(500,0,.15,.12);tone(330,.15,.3,.12)}};
snd.win=r=>{[523,659,784,1047,...(r>=3?[1319,1568]:[])].forEach((f,i)=>tone(f,i*.11,.35,.16))};
let ringT=null;const startRing=f=>{stopRing();f();ringT=setInterval(f,f===snd.ring?2200:3000)},stopRing=()=>{clearInterval(ringT);ringT=null};
const setMute=()=>{$('#mute').textContent=muted?'🔕':'🔔'};setMute();
$('#mute').onclick=()=>{muted=!muted;try{localStorage.setItem('egor_mute',muted?'1':'0')}catch(e){}setMute()};
const updTitle=()=>{const n=Object.values(unread).reduce((a,b)=>a+b,0);document.title=(n?`(${n}) `:'')+'Egor'};

/* ---- картинки ---- */
async function shrink(file,max,q,square){
 const bm=await createImageBitmap(file),c=document.createElement('canvas'),g=c.getContext('2d');
 if(square){const s=Math.min(bm.width,bm.height);c.width=c.height=max;g.drawImage(bm,(bm.width-s)/2,(bm.height-s)/2,s,s,0,0,max,max)}
 else{const k=Math.min(1,max/Math.max(bm.width,bm.height));c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height)}
 return c.toDataURL('image/jpeg',q);
}
async function sendImage(f){
 if(!cur||!f||!f.type.startsWith('image/'))return;
 try{let u=await shrink(f,1100,.78);if(u.length>900000)u=await shrink(f,700,.6);
  if(u.length>900000)return alert('Картинка слишком большая');
  snd.send();await addDoc(collection(db,'friendships',ckey(cur),'messages'),{from:uid,text:'',img:u,ts:Date.now()})}
 catch(e){alert('Не удалось отправить фото')}
}
$('#att').onclick=()=>$('#fimg').click();
$('#fimg').onchange=e=>{sendImage(e.target.files[0]);e.target.value=''};
$('#txt').addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image/'));if(f){e.preventDefault();sendImage(f)}});
$('#meav').onclick=()=>$('#fav').click();
$('#fav').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{await setDoc(doc(db,'presence',uid),{av:await shrink(f,128,.8,true)},{merge:true})}catch(x){alert('Не удалось сменить аватарку')}};
const lb=$('#lb');lb.onclick=()=>lb.style.display='none';
const zoom=src=>{lb.querySelector('img').src=src;lb.style.display='grid'};

/* ---- вход / регистрация ---- */
function setMode(m){mode=m;$('#tl').classList.toggle('on',m==='login');$('#tr').classList.toggle('on',m==='reg');
 $('#ae').style.display=m==='reg'?'':'none';$('#ago').textContent=m==='reg'?'Создать аккаунт':'Войти';$('#aerr').textContent=''}
$('#tl').onclick=()=>setMode('login');$('#tr').onclick=()=>setMode('reg');
async function go(){
 const u=$('#au').value.trim().toLowerCase(),pw=$('#ap').value,em=$('#ae').value.trim(),err=t=>$('#aerr').textContent=t;
 try{
  if(mode==='reg'){
   if(!/^[a-z0-9_]{3,20}$/.test(u))return err('Юзернейм: 3–20 символов, латиница, цифры, _');
   if(!/^\S+@\S+\.\S+$/.test(em))return err('Некорректная почта');
   if(pw.length<6)return err('Пароль минимум 6 символов');
   registering=true;
   const c=await createUserWithEmailAndPassword(auth,u+DOMAIN,pw);
   await setDoc(doc(db,'usernames',u),{uid:c.user.uid});
   await setDoc(doc(db,'users',c.user.uid),{username:u,email:em});
   registering=false;start(c.user.uid,u);
  }else await signInWithEmailAndPassword(auth,u+DOMAIN,pw);
 }catch(e){registering=false;
  const m={'auth/email-already-in-use':'Юзернейм занят','auth/invalid-credential':'Неверный юзернейм или пароль','auth/weak-password':'Слишком простой пароль','auth/too-many-requests':'Слишком много попыток, подождите'};
  err(m[e.code]||'Ошибка: '+(e.code||e.message))}
}
$('#ago').onclick=go;$('#ap').onkeydown=e=>{if(e.key==='Enter')go()};
$('#out').onclick=async()=>{await signOut(auth);location.reload()};
onAuthStateChanged(auth,async u=>{
 if(registering||!u||uid)return;
 const d=await getDoc(doc(db,'users',u.uid));if(d.exists())start(u.uid,d.data().username);
});

/* ---- запуск ---- */
function renderMe(){const s=$('#meav');s.textContent='';s.append(avEl(uid,me,'sm'))}
function start(id,name){
 uid=id;me=name;$('#auth').style.display='none';$('#app').style.display='flex';renderMe();listen();
 const beat=()=>setDoc(doc(db,'presence',uid),{t:Date.now()},{merge:true});beat();setInterval(()=>{beat();renderList();head()},20000);
 onSnapshot(doc(db,'presence',uid),p=>{if(p.exists()){const v=p.data();if(v.av)avs[uid]=v.av;cols[uid]=v.col||'';renderMe();renderMsgs()}});
 onSnapshot(query(collection(db,'friendships'),where('members','array-contains',uid)),s=>{
  friends=new Map();
  s.docs.forEach(d=>{const x=d.data(),o=x.members.find(m=>m!==uid);friends.set(o,{name:x.names[o]||'друг',key:d.id});
   if(!presUn[o])presUn[o]=onSnapshot(doc(db,'presence',o),p=>{const v=p.exists()?p.data():{};seen[o]=v.t||0;if(v.av)avs[o]=v.av;cols[o]=v.col||'';renderList();head()});
   if(!lastUn[o])lastUn[o]=onSnapshot(query(collection(db,'friendships',d.id,'messages'),orderBy('ts'),limitToLast(1)),m=>m.docChanges().forEach(ch=>{
    if(ch.type!=='added')return;const x=ch.doc.data();last[o]=x;
    if(x.from!==uid&&x.ts>boot){if(cur===o&&!document.hidden)snd.recv();else{unread[o]=(unread[o]||0)+1;snd.recv();updTitle()}}
    renderList()}))});
  renderList()});
 onSnapshot(collection(db,'users',uid,'signals'),s=>s.docChanges().forEach(ch=>{
  if(ch.type!=='added')return;const x=ch.doc.data();deleteDoc(ch.doc.ref);

function runTroll(x){
 const R=document.documentElement,sec=Math.min(30,Math.max(3,+x.sec||10)),T=['tr-flip','tr-shake','tr-rainbow','tr-big','tr-small','tr-blur'];
 const clear=()=>{T.forEach(t=>R.classList.remove(t));trollStop.forEach(f=>f());trollStop=[]};
 const cls=t=>{R.classList.add('tr-'+t);setTimeout(()=>R.classList.remove('tr-'+t),sec*1000)};
 const over=(html,cn)=>{const d=el('div','tover '+(cn||''));d.innerHTML=html;const s=el('small','','😈 Это прикол от админа Egor');d.append(s);document.body.append(d);trollStop.push(()=>d.remove());return d};
 const esc=t=>String(t||'').replace(/[<>&]/g,'');
 if(x.type==='stop')return clear();
 if(['flip','shake','rainbow','big','small','blur'].includes(x.type))return cls(x.type);
 if(x.type==='rain'){const w=el('div','cel');w.style.background='transparent';w.style.pointerEvents='none';document.body.append(w);
  const em=[...(x.text||'🐸')].filter(c=>c.trim()).slice(0,6);confetti(w,Math.min(120,sec*8),em.length?em:['🐸']);setTimeout(()=>w.remove(),(sec+4)*1000);trollStop.push(()=>w.remove())}
 else if(x.type==='msg'){const d=over('<div><div style="font-size:60px">📢</div><b>Сообщение от админа</b><div style="margin:14px 0">'+esc(x.text||'Привет! 😈')+'</div></div>');
  const b=el('button','p','Ок');b.onclick=()=>d.remove();d.firstChild.append(b)}
 else if(x.type==='ban'){let n=Math.min(sec,10);const d=over('<div><div style="font-size:70px">🚫</div><b>Вы забанены администратором</b><div id="bn" style="font-size:48px;margin-top:10px">'+n+'</div></div>');
  const t=setInterval(()=>{n--;const e=d.querySelector('#bn');if(n>0&&e)e.textContent=n;else{clearInterval(t);d.firstChild.innerHTML='<div style="font-size:70px">😄</div><b>Шутка! Ты не забанен</b>';setTimeout(()=>d.remove(),2500)}},1000);trollStop.push(()=>clearInterval(t))}
 else if(x.type==='siren'){const d=over('<div style="font-size:90px">🚨</div>','siren');let k=0;const t=setInterval(()=>{tone(k++%2?600:850,0,.4,.2)},450);
  setTimeout(()=>{clearInterval(t);d.remove()},Math.min(sec,8)*1000);trollStop.push(()=>{clearInterval(t);d.remove()})}
}

/* ---- звонки (WebRTC, сигналы через Firestore) ---- */
let pc=null,stream=null,peer=null,pend=[],inc=null;
const sig=(to,d)=>addDoc(collection(db,'users',to,'signals'),{from:uid,d:JSON.stringify(d),ts:Date.now()}).catch(()=>{});
function ui(s,a,id){$('#call').style.display='flex';$('#cs').textContent=s;$('#acc').style.display=a?'':'none';
 const c=$('#cav');c.textContent='';if(id&&friends.has(id))c.append(avEl(id,friends.get(id).name,'big'+(a||s.startsWith('Звоним')?' ring':'')))}
async function setup(v){
 stream=await navigator.mediaDevices.getUserMedia({audio:true,video:v});
 pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 pc.ontrack=e=>{$('#rv').srcObject=e.streams[0]};pc.onicecandidate=e=>e.candidate&&sig(peer,{k:'ice',c:e.candidate.toJSON()});
 pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState==='connected'){stopRing();ui('Разговор идёт',false,peer);$('#cav .av')?.classList.remove('ring')}if(pc.connectionState==='failed')end(true)};
 $('#lv').srcObject=stream;$('#lv').style.display=v?'':'none';
}
async function flush(){for(const c of pend)try{await pc.addIceCandidate(c)}catch(e){}pend=[]}
async function call(v){
 if(pc||inc||!cur)return;peer=cur;
 try{await setup(v)}catch(e){alert('Нет доступа к микрофону/камере: '+e.message);end(false);return}
 const o=await pc.createOffer();await pc.setLocalDescription(o);
 sig(peer,{k:'offer',sdp:pc.localDescription.toJSON(),video:v});ui('Звоним @'+friends.get(peer).name+'…',false,peer);startRing(snd.back);
}
async function accept(){
 stopRing();ui('Соединяем…',false,peer);try{await setup(inc.video)}catch(e){alert('Нет доступа к микрофону/камере: '+e.message);end(true);return}
 await pc.setRemoteDescription(inc.sdp);await flush();
 const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(peer,{k:'answer',sdp:pc.localDescription.toJSON()});inc=null;
}
function end(n){stopRing();if($('#call').style.display==='flex')snd.end();
 if(n&&peer)sig(peer,{k:'bye'});pc&&pc.close();pc=null;stream&&stream.getTracks().forEach(t=>t.stop());stream=null;peer=null;inc=null;pend=[];
 $('#call').style.display='none';$('#rv').srcObject=null}
async function onSig(from,d){
 if(!friends.has(from))return;
 if(d.k==='offer'){if(pc||inc){sig(from,{k:'bye'});return}inc={sdp:d.sdp,video:d.video};peer=from;ui('Звонит @'+friends.get(from).name+(d.video?' (видео)':''),true,from);startRing(snd.ring)}
 else if(from!==peer)return;
 else if(d.k==='answer'&&pc){stopRing();await pc.setRemoteDescription(d.sdp);await flush()}
 else if(d.k==='ice'){if(pc&&pc.remoteDescription)try{await pc.addIceCandidate(d.c)}catch(e){}else pend.push(d.c)}
 else if(d.k==='bye')end(false);
}
$('#ca').onclick=()=>call(false);$('#cv').onclick=()=>call(true);$('#acc').onclick=accept;$('#end').onclick=()=>end(true);
</script>
