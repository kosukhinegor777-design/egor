<html lang="ru">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#f3f4fb;--panel:#fff;--text:#16182b;--muted:#7a7f9a;--line:#e4e6f2;--brand:#5b5bf0;--brand2:#8b4be8;--their:#eceefa;--ok:#22c55e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0e0f1a;--panel:#171829;--text:#eef0ff;--muted:#8d92b0;--line:#26283f;--their:#23253d}}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:var(--their);color:var(--text);padding:9px 13px;transition:transform .12s,filter .15s,background .15s}
button:hover{filter:brightness(1.12)}button:active{transform:scale(.93)}
button.p{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--text);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,91,240,.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,75,232,.7)}100%{box-shadow:0 0 0 28px rgba(139,75,232,0)}}
@keyframes grad{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#auth{height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#5b5bf0,#8b4be8,#3b82f6);background-size:300% 300%;animation:grad 12s ease infinite;padding:16px}
#auth .box{background:var(--panel);border-radius:20px;padding:26px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;animation:pop .4s ease-out}
#auth img{width:72px;height:72px;border-radius:18px;align-self:center}#auth h1{margin:0;text-align:center}
.tabs{display:flex;gap:6px}.tabs button{flex:1}.tabs .on{background:var(--brand);color:#fff}
#aerr{color:#e5484d;min-height:20px;font-size:14px}
#app{display:none;height:100dvh;width:100%;background:var(--panel);animation:fade .4s}
#side{width:360px;max-width:40%;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:280px}
.brand{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:700;font-size:20px}
.brand>img{width:34px;height:34px;border-radius:9px}.brand>span{flex:1}.brand button{padding:6px 10px;font-size:14px;background:rgba(0,0,0,.28);color:#fff}
#addrow{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
#list{overflow:auto;flex:1}
.ct{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .15s,padding-left .15s}
.ct:hover{background:var(--their);padding-left:20px}.ct.on{background:var(--their)}
.ct .w{flex:1;min-width:0}.ct .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;position:relative;background:linear-gradient(135deg,var(--brand),var(--brand2)) center/cover;transition:transform .2s}
.av.sm{width:36px;height:36px;font-size:14px;cursor:pointer;border:2px solid rgba(255,255,255,.7)}.av.sm:hover{transform:scale(1.1)}
.av.big{width:120px;height:120px;font-size:48px}.av.ring{animation:pulse 1.4s infinite}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.nm{font-weight:600}.sub{color:var(--muted);font-size:13px}
.bd{background:var(--brand);color:#fff;border-radius:11px;padding:1px 8px;font-size:12px;font-weight:700;animation:pop .25s}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:64px}
#head .t{flex:1;min-width:0}#back{display:none}
#msgs{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:6px;background:var(--bg);scroll-behavior:smooth}
.m{max-width:70%;padding:8px 12px;border-radius:18px 18px 18px 4px;background:var(--their);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap}
.m.me{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;align-self:flex-end;border-radius:18px 18px 4px 18px}
.m.new{animation:pop .25s ease-out}
.m small{display:block;color:var(--muted);font-size:12px}.m.me small{color:#e4e4ff}
.m img{display:block;max-width:100%;max-height:340px;border-radius:12px;cursor:zoom-in;margin-bottom:4px;transition:transform .2s}.m img:hover{transform:scale(1.02)}
#bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
#bar button.ic{font-size:20px;padding:7px 11px}
.empty{margin:auto;color:var(--muted);text-align:center;animation:fade .5s}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:10;cursor:zoom-out;animation:fade .2s}
#lb img{max-width:94vw;max-height:94vh;border-radius:10px;animation:pop .25s}
@media (max-width:700px){#side{width:100%;max-width:100%}#main{display:none}#app.chat #side{display:none}#app.chat #main{display:flex}#back{display:inline-block}.m{max-width:85%}}

.av.prem{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #f5b301}
.brand{gap:6px}.brand button{padding:6px 8px}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:8;animation:fade .2s}
#mod .card{background:var(--panel);border-radius:18px;padding:18px;width:min(580px,94vw);max-height:88vh;overflow:auto;animation:pop .25s}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:8px}
.sec{font-weight:700;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.gift,.gcard{border-radius:14px;padding:10px;text-align:center;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.gift{cursor:pointer;transition:transform .15s}.gift:hover{transform:translateY(-3px) scale(1.04)}
.gift .e,.gcard .e{font-size:44px;line-height:1.2}.gift img,.gcard img{width:64px;height:64px;border-radius:12px;object-fit:cover;margin:0!important;max-height:none!important}
.gcard{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:140px;animation:pop .4s}
.num{font-size:11px;color:var(--muted)}
.r1{background-image:linear-gradient(135deg,#3b82f633,#06b6d433)}.r2{background-image:linear-gradient(135deg,#8b5cf655,#ec489944)}
.r3{background-image:linear-gradient(135deg,#f59e0b66,#ef444444);box-shadow:0 0 16px #f59e0b66}
.hero{text-align:center;padding:10px}.hero .e{font-size:56px;animation:pulse 2s infinite;border-radius:50%;display:inline-block}
.perk{padding:7px 10px;border-radius:10px;background:var(--their);margin:5px 0}
.sw{display:flex;gap:8px;flex-wrap:wrap}.swb{width:36px;height:36px;border-radius:50%!important;padding:0!important}
.form{display:flex;flex-direction:column;gap:8px}.form select{font:inherit;padding:10px;border-radius:10px;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.form label{display:flex;gap:8px;align-items:center}.form label input{width:auto}
.row{display:flex;gap:8px;align-items:center;margin:4px 0}.row span{flex:1}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:14px;z-index:20;animation:pop .3s;box-shadow:0 8px 30px rgba(0,0,0,.4)}

.cel{position:fixed;inset:0;z-index:30;background:radial-gradient(circle,rgba(0,0,0,.5),rgba(0,0,0,.88));display:grid;place-items:center;animation:fade .3s;overflow:hidden;cursor:pointer}
.cbox{background:var(--panel);color:var(--text);border-radius:26px;padding:30px 44px;text-align:center;animation:boom .8s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 70px #8b4be8aa;max-width:90vw}
.cbox.r3{box-shadow:0 0 100px #f59e0b}.cbox h2{margin:8px 0 4px}
.cbox .e{font-size:100px;animation:spin 1.2s ease-out,floaty 2s ease-in-out 1s infinite}
.cbox img{width:130px;height:130px;border-radius:22px;object-fit:cover;animation:spin 1.2s ease-out,floaty 2s ease-in-out 1s infinite}
@keyframes boom{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes spin{from{transform:rotateY(720deg) scale(.2)}to{transform:none}}
@keyframes floaty{50%{transform:translateY(-12px)}}
.cf{position:absolute;top:-40px;font-size:26px;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
body{transition:transform .8s,filter .5s}
html.tr-flip body{transform:rotate(180deg)}
html.tr-shake body{animation:shake .4s infinite}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-8px,4px) rotate(-.6deg)}50%{transform:translate(8px,-4px) rotate(.6deg)}75%{transform:translate(-6px,-3px)}}
html.tr-rainbow body{animation:hue 1.5s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
html.tr-big body{zoom:1.6}html.tr-small body{zoom:.65}html.tr-blur body{filter:blur(5px)}
.tover{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;color:#fff;background:rgba(10,10,25,.94);font-size:26px;animation:fade .3s;padding:20px}
.tover small{position:absolute;bottom:20px;opacity:.7;font-size:13px}
.tover.siren{animation:siren .5s infinite alternate}@keyframes siren{from{background:rgba(200,0,0,.92)}to{background:rgba(0,40,200,.92)}}

#main{position:relative}#hav,#title{cursor:pointer}
.rb{background:linear-gradient(90deg,#f43f5e,#f59e0b,#10b981,#3b82f6,#8b5cf6,#f43f5e);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 4s linear infinite}
.av.fr-neon{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #22d3ee,0 0 14px #22d3ee}
.av.fr-fire{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #f97316,0 0 16px #ef4444}
.av.fr-rainbow{animation:ringc 3s linear infinite}
@keyframes ringc{0%,100%{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #f43f5e}33%{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #22c55e}66%{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #3b82f6}}
.pban{height:110px;border-radius:14px}
.ptop{display:flex;flex-direction:column;align-items:center;margin-top:-52px;gap:2px}.ptop .av{border:4px solid var(--panel)}
.pname{font-size:22px;font-weight:700}.pbio{text-align:center;margin:10px 0;color:var(--text);white-space:pre-wrap}
.opt.sel,.gift.sel{outline:3px solid var(--brand)}.opt{font-size:18px;display:grid;place-items:center}
.m.stk{background:transparent!important;padding:2px 6px}.m.stk small{color:var(--muted)!important}
.sticker{font-size:76px;line-height:1.1;animation:bounce 1.1s ease-out}
@keyframes bounce{0%{transform:scale(0) rotate(-30deg)}50%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}
#emp{position:absolute;left:12px;bottom:70px;width:min(380px,92%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:none;z-index:6;animation:pop .2s}
.egrid{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-height:200px;overflow:auto}
.eo{font-size:28px;cursor:pointer;padding:3px 5px;border-radius:8px;transition:transform .12s}.eo:hover{transform:scale(1.3);background:var(--their)}.eo.lock{opacity:.45}

.av.xl{width:200px;height:200px;font-size:80px}.av.lg{width:84px;height:84px;font-size:34px}
#call{position:fixed;inset:0;background:#0e0e11;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:9;animation:fade .25s;transition:opacity .2s}
#call.min{opacity:0;pointer-events:none}
#ccenter{display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2}
#cname{font-size:30px}#cs{opacity:.8;font-size:15px;margin-bottom:26px}
#cav{position:relative}#cav::before{content:"";position:absolute;inset:-150px;background:radial-gradient(circle,rgba(34,197,94,.4),transparent 62%);opacity:.2;transition:opacity .3s;pointer-events:none}
#cav.speak::before{opacity:1}#cav.speak .av{box-shadow:0 0 0 6px rgba(34,197,94,.65)}
#rvw{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s}
#call.rvid #rvw{opacity:1}#rv{width:100%;height:100%;object-fit:contain}
#call.rvid #ccenter{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.45);padding:6px 16px;border-radius:20px}
#call.rvid #cav{display:none}#call.rvid #cname{font-size:16px}#call.rvid #cs{margin:0;font-size:12px}
#self{position:absolute;top:70px;right:16px;width:250px;height:185px;border-radius:16px;background:linear-gradient(160deg,#2a2a30,#17171b);border:3px solid transparent;overflow:hidden;display:grid;place-items:center;z-index:4;transition:border-color .2s}
#self.speak{border-color:#22c55e}#self video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.slab{position:absolute;left:10px;bottom:8px;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;z-index:2;text-shadow:0 1px 4px #000}
.bars b{width:3px;height:10px;background:#22c55e;border-radius:2px;display:inline-block;margin-left:2px}
#self.speak .bars b{animation:eq .45s infinite alternate}.bars b:nth-child(2){animation-delay:.15s!important}.bars b:nth-child(3){animation-delay:.3s!important}
@keyframes eq{to{height:3px}}
.cb{width:56px;height:56px;border-radius:50%;font-size:22px;padding:0;background:#2b2d36;color:#fff;display:grid;place-items:center}
.cb.on{background:#fff;color:#111}.cb.off,.cb.red{background:#e5484d}.cb.green{background:#22c55e}.hang span{display:inline-block;transform:rotate(135deg)}
#cbar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px;background:rgba(255,255,255,.08);padding:8px;border-radius:40px;z-index:5;backdrop-filter:blur(8px)}
#cin{position:absolute;bottom:40px;display:flex;gap:46px;z-index:5}
#cfs{position:absolute;top:16px;right:16px;z-index:5;width:44px;height:44px;font-size:18px}
#cmin{position:absolute;right:16px;bottom:22px;z-index:5;width:48px;height:48px}
#call.incoming #cbar,#call.incoming #self,#call.incoming #cmin{display:none}#call:not(.incoming) #cin{display:none}
#cpill{display:none;position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:11;background:#22c55e;color:#fff;padding:8px 18px;border-radius:24px;cursor:pointer;gap:8px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:pop .3s}
@media (max-width:700px){#self{width:120px;height:90px;top:64px}.av.xl{width:150px;height:150px;font-size:60px}#cbar{gap:8px}.cb{width:50px;height:50px}}

.brand{flex-wrap:wrap;row-gap:6px}
#mod .card.wide{width:min(1100px,96vw)}
.cbalrow{padding:8px 12px;background:var(--their);border-radius:12px;margin-bottom:10px;font-size:15px}
.cbody{display:flex;flex-direction:column;gap:12px;margin-top:12px;align-items:stretch}
.cbody .row input,.cbody>input[type=number]{max-width:140px}

.coin{font-size:96px;text-align:center;line-height:1.1}.coin.spin{animation:cflip 1.3s ease-in-out}
@keyframes cflip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-50px)}100%{transform:rotateY(1800deg) translateY(0)}}
.dbar{position:relative;height:18px;border-radius:9px;background:#ef444455;margin:14px 6px}
.dzone{height:100%;border-radius:9px;background:#22c55e;transition:width .15s}
.dmk{position:absolute;top:-5px;width:5px;height:28px;border-radius:3px;background:var(--text);left:0;transition:left .07s}
.dnum{text-align:center;font-size:54px;font-weight:800}
.reels{display:flex;gap:10px;justify-content:center}.reel{font-size:60px;width:92px;height:92px;border-radius:16px;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center}
.upg{display:grid;grid-template-columns:1fr 280px 1fr;gap:14px;align-items:start}
.upp{background:var(--bg);border-radius:14px;padding:12px;max-height:56vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.upc{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.wheel{position:relative;width:260px;height:260px}.wheel svg{width:100%;height:100%}
.aw{position:absolute;inset:0}

.pct{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:800;color:#facc15}

/* ===== Aurora redesign ===== */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#090913;--panel:#171829;--card:rgba(22,23,41,.74);--text:#eef0ff;--muted:#8d92b0;--line:rgba(255,255,255,.07);--their:#252741;--shadow:0 12px 44px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#090913;--panel:#171829;--card:rgba(22,23,41,.74);--text:#eef0ff;--muted:#8d92b0;--line:rgba(255,255,255,.07);--their:#252741;--shadow:0 12px 44px rgba(0,0,0,.5)}

*{scrollbar-width:thin;scrollbar-color:rgba(130,130,170,.35) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(130,130,170,.35);border-radius:8px}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;
 background:radial-gradient(900px 520px at 8% -8%,rgba(99,102,241,.38),transparent 60%),radial-gradient(800px 520px at 100% 0%,rgba(236,72,153,.22),transparent 55%),radial-gradient(900px 600px at 50% 115%,rgba(34,211,238,.2),transparent 60%),var(--bg)}
button{border-radius:12px;font-weight:600;letter-spacing:.01em}
button.p{background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 6px 18px rgba(99,102,241,.38)}
input,textarea{border-radius:14px;padding:12px 14px}

#auth img{width:84px;height:84px;border-radius:24px;box-shadow:0 10px 30px rgba(99,102,241,.5)}
.tabs{background:var(--their);padding:4px;border-radius:14px}.tabs button{background:transparent;border-radius:11px}.tabs .on{background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 4px 12px rgba(99,102,241,.4)}
#app{height:calc(100dvh - 28px);gap:14px;background:transparent}
#side,#main{background:var(--card);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
#side{width:380px;max-width:42%;border-right:1px solid var(--line)}

<script type="module">
import firebaseConfig from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,addDoc,deleteDoc,collection,query,where,orderBy,limitToLast,onSnapshot,getDocs,updateDoc,writeBatch,increment,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $=s=>document.querySelector(s);
const hideBoot=()=>{window.__egorReady=1;const b=$('#boot');if(b){b.classList.add('out');setTimeout(()=>b.remove(),500)}};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const DOMAIN='@egor.app';
let mode='login',registering=false,uid=null,me=null,friends=new Map(),seen={},avs={},last={},unread={},cur=null,msgs=[],unMsgs=null,shown=0;
const presUn={},lastUn={},boot=Date.now();
const ckey=o=>[uid,o].sort().join('_');
let prem={},cat={},cols={},myGifts=[],profs={};
const isPrem=id=>(prem[id]||0)>Date.now();
const isOn=f=>seen[f]&&Date.now()-seen[f]<50000;
const prev=x=>x?(x.from===uid?'Вы: ':'')+(x.sticker?'Стикер '+x.sticker:x.img&&!x.text?'📷 Фото':x.text):'';
const avEl=(id,name,cls='')=>{const d=el('div','av '+cls,avs[id]?'':(name||'?')[0].toUpperCase());if(avs[id])d.style.backgroundImage=`url(${avs[id]})`;if(isPrem(id))d.classList.add('prem','fr-'+((profs[id]&&profs[id].frame)||'gold'));
 if(!cls.split(' ').includes('nc')){d.style.cursor='pointer';d.onclick=e=>{e.stopPropagation();openProfile(id)}}return d};

/* ---- звуки (генерируются в браузере) ---- */
let ac,muted=false;try{muted=localStorage.getItem('egor_mute')==='1'}catch(e){}
const ctx=()=>ac||(ac=new(window.AudioContext||window.webkitAudioContext)());
document.addEventListener('click',()=>{try{ctx().resume()}catch(e){}});
function tone(f,t0,d,v=.15){if(muted)return;try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);
 const s=c.currentTime+t0;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.05)}catch(e){}}
const snd={send:()=>{tone(660,0,.12,.1);tone(880,.07,.14,.1)},recv:()=>{tone(880,0,.15,.15);tone(1175,.1,.28,.15)},
 ring:()=>{[0,.4].forEach(x=>{tone(740,x,.25,.22);tone(988,x+.12,.25,.22)})},back:()=>tone(440,0,.9,.08),end:()=>{tone(500,0,.15,.12);tone(330,.15,.3,.12)}};
snd.win=r=>{[523,659,784,1047,...(r>=3?[1319,1568]:[])].forEach((f,i)=>tone(f,i*.11,.35,.16))};
let ringT=null;const startRing=f=>{stopRing();f();ringT=setInterval(f,f===snd.ring?2200:3000)},stopRing=()=>{clearInterval(ringT);ringT=null};
const setMute=()=>{$('#mute').innerHTML='<b class="mi" style="--c:#06b6d4">'+(muted?'🔕':'🔔')+'</b><i>'+(muted?'Звуки выключены':'Звуки включены')+'</i>'};setMute();
$('#mute').onclick=()=>{muted=!muted;try{localStorage.setItem('egor_mute',muted?'1':'0')}catch(e){}setMute()};
const updTitle=()=>{const n=Object.values(unread).reduce((a,b)=>a+b,0);document.title=(n?`(${n}) `:'')+'Egor'};

/* ---- картинки ---- */
async function shrink(file,max,q,square){
 const bm=await createImageBitmap(file),c=document.createElement('canvas'),g=c.getContext('2d');
 if(square){const s=Math.min(bm.width,bm.height);c.width=c.height=max;g.drawImage(bm,(bm.width-s)/2,(bm.height-s)/2,s,s,0,0,max,max)}
 else{const k=Math.min(1,max/Math.max(bm.width,bm.height));c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height)}
 return c.toDataURL('image/jpeg',q);
}
async function sendImage(f){
 if(!cur||!f||!f.type.startsWith('image/'))return;
 const ph=el('div','sk sk-b');ph.style.cssText='width:38%;height:150px;align-self:flex-end';$('#msgs').append(ph);$('#msgs').scrollTop=1e9;
 try{let u=isPrem(uid)?await shrink(f,1600,.9):await shrink(f,1100,.78);if(u.length>900000)u=await shrink(f,1100,.75);if(u.length>900000)u=await shrink(f,700,.6);
  if(u.length>900000)return alert('Картинка слишком большая');
  snd.send();await addDoc(collection(db,'friendships',ckey(cur),'messages'),{from:uid,text:'',img:u,ts:Date.now()})}
 catch(e){alert('Не удалось отправить фото')}finally{ph.remove()}
}
$('#att').onclick=()=>$('#fimg').click();
$('#fimg').onchange=e=>{sendImage(e.target.files[0]);e.target.value=''};
$('#txt').addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image/'));if(f){e.preventDefault();sendImage(f)}});
$('#meav').onclick=()=>openProfile(uid);
$('#fav').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{await setDoc(doc(db,'presence',uid),{av:await shrink(f,128,.8,true)},{merge:true})}catch(x){alert('Не удалось сменить аватарку')}};
const lb=$('#lb');lb.onclick=()=>lb.style.display='none';
const zoom=src=>{lb.querySelector('img').src=src;lb.style.display='grid'};

/* ---- вход / регистрация ---- */
function setMode(m){mode=m;$('#tl').classList.toggle('on',m==='login');$('#tr').classList.toggle('on',m==='reg');
 $('#ae').style.display=m==='reg'?'':'none';$('#ago').textContent=m==='reg'?'Создать аккаунт':'Войти';$('#aerr').textContent=''}
$('#tl').onclick=()=>setMode('login');$('#tr').onclick=()=>setMode('reg');
async function go(){
 const u=$('#au').value.trim().toLowerCase(),pw=$('#ap').value,em=$('#ae').value.trim(),err=t=>$('#aerr').textContent=t,btn=$('#ago');
 btn.classList.add('load');btn.disabled=true;
 try{
  if(mode==='reg'){
   if(!/^[a-z0-9_]{3,20}$/.test(u))return err('Юзернейм: 3–20 символов, латиница, цифры, _');
   if(!/^\S+@\S+\.\S+$/.test(em))return err('Некорректная почта');
   if(pw.length<6)return err('Пароль минимум 6 символов');
   registering=true;
   const c=await createUserWithEmailAndPassword(auth,u+DOMAIN,pw);
   await setDoc(doc(db,'usernames',u),{uid:c.user.uid});
   await setDoc(doc(db,'users',c.user.uid),{username:u,email:em});
   registering=false;start(c.user.uid,u);
  }else await signInWithEmailAndPassword(auth,u+DOMAIN,pw);
 }catch(e){registering=false;
  const m={'auth/email-already-in-use':'Юзернейм занят','auth/invalid-credential':'Неверный юзернейм или пароль','auth/weak-password':'Слишком простой пароль','auth/too-many-requests':'Слишком много попыток, подождите'};
  err(m[e.code]||'Ошибка: '+(e.code||e.message))}finally{btn.classList.remove('load');btn.disabled=false}
}
$('#ago').onclick=go;$('#ap').onkeydown=e=>{if(e.key==='Enter')go()};
$('#out').onclick=async()=>{await signOut(auth);location.reload()};
onAuthStateChanged(auth,async u=>{
 if(registering)return;
 if(!u){hideBoot();return}
 if(uid)return;
 try{const d=await getDoc(doc(db,'users',u.uid));if(d.exists())start(u.uid,d.data().username)}catch(e){$('#aerr').textContent='Нет связи с сервером. Проверь интернет или VPN'}
 hideBoot();
});

/* ---- запуск ---- */
function renderMe(){const s=$('#meav');s.textContent='';s.append(avEl(uid,me,'sm'))}
function start(id,name){
 uid=id;me=name;$('#auth').style.display='none';$('#app').style.display='flex';renderMe();listen();renderList();setTimeout(()=>{if(!friendsLoaded){friendsLoaded=true;renderList()}},8000);
 const beat=()=>setDoc(doc(db,'presence',uid),{t:Date.now()},{merge:true});beat();setInterval(()=>{beat();renderList();head()},20000);
 onSnapshot(doc(db,'presence',uid),p=>{if(p.exists()){const v=p.data();if(v.av)avs[uid]=v.av;cols[uid]=v.col||'';renderMe();renderMsgs()}});
 onSnapshot(query(collection(db,'friendships'),where('members','array-contains',uid)),s=>{
  friends=new Map();
  s.docs.forEach(d=>{const x=d.data(),o=x.members.find(m=>m!==uid);friends.set(o,{name:x.names[o]||'друг',key:d.id,read:((x.read||{})[o])||0,typing:((x.typing||{})[o])||0});
   if(!presUn[o])presUn[o]=onSnapshot(doc(db,'presence',o),p=>{const v=p.exists()?p.data():{};seen[o]=v.t||0;if(v.av)avs[o]=v.av;cols[o]=v.col||'';renderList();head()});
   if(!lastUn[o])lastUn[o]=onSnapshot(query(collection(db,'friendships',d.id,'messages'),orderBy('ts'),limitToLast(1)),m=>m.docChanges().forEach(ch=>{
    if(ch.type!=='added')return;const x=ch.doc.data();last[o]=x;
    if(x.from!==uid&&x.ts>boot){if(cur===o&&!document.hidden)snd.recv();else{unread[o]=(unread[o]||0)+1;snd.recv();updTitle()}}
    renderList()}))});
  friendsLoaded=true;renderList();head();{const rd=(friends.get(cur)||{}).read||0;if(rd!==prevRd){prevRd=rd;renderMsgs()}}});
 onSnapshot(collection(db,'users',uid,'signals'),s=>s.docChanges().forEach(ch=>{
  if(ch.type!=='added')return;const x=ch.doc.data();deleteDoc(ch.doc.ref);
  if(Date.now()-x.ts<30000)onSig(x.from,JSON.parse(x.d))}));
}
document.addEventListener('visibilitychange',()=>{markRead();if(!document.hidden&&cur&&unread[cur]){unread[cur]=0;updTitle();renderList()}});

/* ---- чаты ---- */
function renderList(){
 const L=$('#list');L.textContent='';if(!friendsLoaded){skRows(L,7);return}if(!friends.size)L.append(el('div','empty','Пока нет друзей'));
 [...friends].sort((a,b)=>(last[b[0]]?.ts||0)-(last[a[0]]?.ts||0)||a[1].name.localeCompare(b[1].name)).forEach(([id,f])=>{
  const on=isOn(id),r=el('div','ct'+(cur===id?' on':''));
  const a=avEl(id,f.name);if(on)a.classList.add('on');r.append(a);
  const w=el('div','w');w.append((()=>{const n=el('div','nm');applyName(n,id,f.name);return n})(),(()=>{const t=isTyp(id);return el('div','sub'+(t?' typ':''),t?'печатает':(prev(last[id])||(on?'в сети':'не в сети')))})());r.append(w);
  if(unread[id])r.append(el('span','bd',unread[id]));r.onclick=()=>openChat(id);L.append(r)});
}
function head(){if(cur&&friends.has(cur)){const f=friends.get(cur);applyName($('#title'),cur,f.name);const ty=isTyp(cur);$('#st').textContent=ty?'печатает':'@'+f.name+' · '+(isOn(cur)?'в сети':'не в сети');$('#st').classList.toggle('typ',ty);
 const h=$('#hav');h.textContent='';h.append(avEl(cur,f.name))}}
function openChat(f){
 cur=f;prevRd=(friends.get(f)||{}).read||0;unread[f]=0;updTitle();$('#app').classList.add('chat');head();renderList();msgs=[];shown=-1;msgLoading=true;setTimeout(()=>{if(msgLoading&&cur===f){msgLoading=false;renderMsgs()}},6000);renderMsgs();unMsgs&&unMsgs();
 unMsgs=onSnapshot(query(collection(db,'friendships',ckey(f),'messages'),orderBy('ts'),limitToLast(200)),s=>{msgs=s.docs.map(d=>d.data());msgLoading=false;renderMsgs();markRead()});
}
function dayLabel(ts){const d=new Date(ts),n=new Date(),y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1),same=(a,b)=>a.toDateString()===b.toDateString();
 return el('div','dsep',same(d,n)?'Сегодня':same(d,y)?'Вчера':d.toLocaleDateString('ru-RU',d.getFullYear()!==n.getFullYear()?{day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'long'}))}
function renderMsgs(){
 const B=$('#msgs');B.style.background=(isPrem(uid)&&profs[uid]&&profs[uid].wall>0)?WALLS[profs[uid].wall]:'';B.textContent='';if(msgLoading){skMsgs(B);return}if(!msgs.length)B.append(el('div','empty',cur?'Пока пусто. Напиши первым!':'Выбери чат'));
 let lastDay='';
 msgs.forEach((m,i)=>{const dk=new Date(m.ts).toDateString();if(dk!==lastDay){lastDay=dk;B.append(dayLabel(m.ts))}
  const d=el('div','m'+(m.from===uid?' me':'')+(shown>=0&&i>=shown?' new':''));
  const col=isPrem(m.from)&&cols[m.from];if(col){d.style.background=`linear-gradient(135deg,${col},${col}bb)`;d.style.color='#fff'}
  if(m.gift){const c=cat[m.gift.t]||{name:'Подарок',emoji:'🎁',rarity:0},g=el('div','gcard r'+(c.rarity||0));
   if(c.img){const im=el('img');im.src=c.img;g.append(im)}else g.append(el('div','e',c.emoji||'🎁'));
   g.append(el('b','',c.name),el('div','num',m.gift.n?'NFT №'+m.gift.n:'Подарок'));d.append(g)}
  else if(m.sticker){d.classList.add('stk');d.append(el('div','sticker',m.sticker))}
  else{if(m.img){const im=el('img');im.src=m.img;im.onclick=()=>zoom(m.img);d.append(im)}
   if(m.text)d.append(document.createTextNode(m.text))}
  const sm=el('small','',new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  if(m.from===uid){const rdv=(friends.get(cur)||{}).read||0,ok=m.ts<=rdv;sm.append(' ',el('span','tk'+(ok?' r':''),ok?'✓✓':'✓'))}
  d.append(sm);B.append(d)});
 shown=msgs.length;B.scrollTop=B.scrollHeight;
}
async function sendMsg(){const t=$('#txt').value.trim();if(!t||!cur)return;$('#txt').value='';snd.send();typSent=0;updateDoc(doc(db,'friendships',ckey(cur)),{['typing.'+uid]:0}).catch(()=>{});
 try{await addDoc(collection(db,'friendships',ckey(cur),'messages'),{from:uid,text:t.slice(0,2000),ts:Date.now()})}catch(e){alert('Не удалось отправить')}}
$('#send').onclick=sendMsg;$('#txt').onkeydown=e=>{if(e.key==='Enter')sendMsg()};
$('#back').onclick=()=>$('#app').classList.remove('chat');
async function addFriend(){
 const u=$('#addu').value.trim().replace(/^@/,'').toLowerCase();if(!u)return;$('#addu').value='';
 if(u===me)return;

function runTroll(x){

 const over=(html,cn)=>{const d=el('div','tover '+(cn||''));d.innerHTML=html;const s=el('small','','😈 Это прикол от админа Egor');d.append(s);document.body.append(d);trollStop.push(()=>d.remove());return d};
 const esc=t=>String(t||'').replace(/[<>&]/g,'');
 if(x.type==='stop')return clear();
 if(['flip','shake','rainbow','big','small','blur'].includes(x.type))return cls(x.type);
 if(x.type==='rain'){const w=el('div','cel');w.style.background='transparent';w.style.pointerEvents='none';document.body.append(w);
  const em=[...(x.text||'🐸')].filter(c=>c.trim()).slice(0,6);confetti(w,Math.min(120,sec*8),em.length?em:['🐸']);setTimeout(()=>w.remove(),(sec+4)*1000);trollStop.push(()=>w.remove())}
 else if(x.type==='msg'){const d=over('<div><div style="font-size:60px">📢</div><b>Сообщение от админа</b><div style="margin:14px 0">'+esc(x.text||'Привет! 😈')+'</div></div>');
  const b=el('button','p','Ок');b.onclick=()=>d.remove();d.firstChild.append(b)}
 else if(x.type==='ban'){let n=Math.min(sec,10);const d=over('<div><div style="font-size:70px">🚫</div><b>Вы забанены администратором</b><div id="bn" style="font-size:48px;margin-top:10px">'+n+'</div></div>');
  const t=setInterval(()=>{n--;const e=d.querySelector('#bn');if(n>0&&e)e.textContent=n;else{clearInterval(t);d.firstChild.innerHTML='<div style="font-size:70px">😄</div><b>Шутка! Ты не забанен</b>';setTimeout(()=>d.remove(),2500)}},1000);trollStop.push(()=>clearInterval(t))}
 else if(x.type==='scream'){const d=el('div','scream');
  if(x.img){const im=el('img');im.src=x.img;d.append(im)}else d.append(el('div','sbig','👻'));
  const cl=el('button','','✕');d.append(el('small','','😈 Это прикол от админа · нажми, чтобы закрыть'),cl);d.onclick=()=>d.remove();document.body.append(d);
  if(x.snd!==false)screamSound();
  const t=setTimeout(()=>d.remove(),Math.min(10,Math.max(2,+x.sec||4))*1000);trollStop.push(()=>{clearTimeout(t);d.remove()})}
 else if(x.type==='siren'){const d=over('<div style="font-size:90px">🚨</div>','siren');let k=0;const t=setInterval(()=>{tone(k++%2?600:850,0,.4,.2)},450);
  setTimeout(()=>{clearInterval(t);d.remove()},Math.min(sec,8)*1000);trollStop.push(()=>{clearInterval(t);d.remove()})}
}

 if(!list.length){p.append(el('div','sub','Админ ещё не создал кейсы 📦'));return}
 const g=el('div','grid');
 list.forEach(([id,c])=>{const e=el('div','gift case');e.append(c.img?(()=>{const i=el('img');i.src=c.img;return i})():el('div','e',c.emoji||'📦'),el('div','nm',c.name),el('div','num','🪙 '+c.price+' · '+slotsOf(c).length+' предм.'));e.onclick=()=>{p.textContent='';caseView(p,id)};g.append(e)});
 p.append(g)}
function caseView(p,id){
 const c=casesC[id];if(!c){gCases(p);return}
 const S=slotsOf(c),back=el('button','','← Все кейсы'),head=el('div','nm',(c.emoji||'📦')+' '+c.name),rl=el('div','rl'),st=el('div','rls'),items=el('div','grid'),go=el('button','p','Открыть за 🪙 '+c.price),res=el('div','gres');
 back.onclick=()=>{p.textContent='';gCases(p)};head.style.fontSize='20px';
 if(c.img){head.textContent='';const hi=el('img');hi.src=c.img;hi.style.cssText='width:56px;height:56px;border-radius:14px;object-fit:cover;vertical-align:middle;margin-right:12px';head.append(hi,c.name)}
 const tile=t=>{const x=cat[t]||{name:'?',emoji:'🎁',rarity:0},d=el('div','rlt r'+(x.rarity||0));
  if(x.img){const i=el('img');i.src=x.img;d.append(i)}else d.append(el('div','e',x.emoji||'🎁'));d.append(el('div','',x.name));return d};
 const rnd=()=>{let x=Math.random()*100,a=0;for(const s of S){a+=s.p;if(x<a)return s.t}return S[0].t};
 for(let i=0;i<10;i++)st.append(tile(rnd()));rl.append(st,el('div','rlm'));
 S.slice().sort((a,b)=>b.p-a.p).forEach(s=>items.append(giftEl({type:s.t},null,s.p.toFixed(1)+'% · 🪙'+((cat[s.t]||{}).price||0))));
 go.onclick=async()=>{go.disabled=true;res.textContent='';
  try{await freshBal();if(bal<c.price)throw 'Не хватает косок';
   const r=await bet({kind:'case',stake:c.price,chance:1,debit:c.price,caseId:id}),drop=dropOf(c,r.T%1000);if(!drop)throw 'Ошибка кейса';
   const W=110,win=38;st.style.transition='none';st.style.transform='translateX(0)';st.textContent='';
   for(let i=0;i<46;i++)st.append(tile(i===win?drop:rnd()));void st.offsetWidth;
   st.style.transition='transform 5s cubic-bezier(.08,.7,.1,1)';st.style.transform='translateX('+(-(win*W+W/2-rl.clientWidth/2+(Math.random()*60-30)))+'px)';
   await sleep(5300);let ok=false;
   for(let i=0;i<3&&!ok;i++){try{await setDoc(doc(db,'gifts','c'+r.id),{type:drop,owner:uid,ownerName:me,fromUid:'case',fromName:'Кейс',n:(maxN[drop]||0)+1,ts:Date.now(),bet:r.id});ok=true}catch(e){await sleep(700)}}
   res.textContent=ok?'🎁 Выпало: '+((cat[drop]||{}).name||'подарок'):'Подарок выпал, но выдать не удалось — напиши админу';res.className='gres win';await freshBal()}
  catch(e){errT(e)}go.disabled=false};
 p.append(back,head,rl,go,res,el('div','sec','Что может выпасть'),items,el('div','sub','Выпавший NFT можно продать в 🛍️ магазине за 70% его цены или использовать в апгрейдере.'))}
$('#cases').onclick=()=>openCasino(4);

const HOL={halloween:{n:'🎃 Хэллоуин',g:'С Хэллоуином! 🎃',b:'🕸️',em:['🎃','🦇','👻','🕸️']},
 newyear:{n:'🎄 Новый год',g:'С Новым годом! 🎄',b:'🎅',em:['❄️','❄️','✨','🎄','⭐']},
 easter:{n:'🐣 Пасха',g:'С Пасхой! 🐣',b:'🐣',em:['🥚','🐣','🌷','🐰']},
 victory:{n:'🎖️ День Победы',g:'С Днём Победы! 🎖️',b:'🎖️',em:['🕊️','⭐','🎆']},
 women:{n:'🌷 8 Марта',g:'С 8 Марта! 🌷',b:'🌷',em:['🌷','🌸','💐','🌹']}};
function orthEaster(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),dd=((d+e+114)%31)+1;return +new Date(y,m-1,dd+13)}
function autoHoliday(){const n=new Date(),y=n.getFullYear(),t=+new Date(y,n.getMonth(),n.getDate()),D=(m,d)=>+new Date(y,m,d),inR=(a,b)=>t>=a&&t<=b;
 if(inR(D(9,24),D(10,1)))return'halloween';if(t>=D(11,15)||t<=D(0,10))return'newyear';if(inR(D(4,5),D(4,10)))return'victory';if(inR(D(2,4),D(2,9)))return'women';
 if(Math.abs(t-orthEaster(y))<=4*864e5)return'easter';return''}
let fxT=null;
function startFx(em){clearInterval(fxT);let L=$('#fx');if(!L){L=el('div');L.id='fx';document.body.append(L)}L.textContent='';
 if(!em||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 fxT=setInterval(()=>{if(document.hidden||L.children.length>22)return;const s=el('span','fxp',em[Math.floor(Math.random()*em.length)]);
  s.style.left=Math.random()*100+'%';s.style.fontSize=(14+Math.random()*16)+'px';s.style.animationDuration=(8+Math.random()*8)+'s';s.style.setProperty('--sw',(Math.random()*90-45)+'px');
  s.onanimationend=()=>s.remove();L.append(s)},700)}
function holSetting(){let s='auto';try{s=localStorage.getItem('egor_hol')||'auto'}catch(e){}return s}
function applyHol(){const s=holSetting(),k=s==='auto'?autoHoliday():s==='off'?'':s,H=HOL[k];
 document.documentElement.dataset.hol=H?k:'';if(!H)delete document.documentElement.dataset.hol;
 $('#hbadge').textContent=H?H.b:'';const sm=document.querySelector('.bt small');if(sm)sm.textContent=H?H.g:'мессенджер';startFx(H&&H.em)}
function openHol(){openMod('🎉 Праздничная тема',c=>{const s=holSetting(),a=autoHoliday();
 [['auto','🗓️ Автоматически по датам'+(a?' (сейчас: '+HOL[a].n+')':'')],['off','🚫 Без праздничной темы'],...Object.entries(HOL).map(([k,v])=>[k,v.n])].forEach(([k,t])=>{
  const b=el('button','perk'+(s===k?' on':''),t);b.style.cssText='width:100%;text-align:left;display:block;margin:6px 0';b.onclick=()=>{try{localStorage.setItem('egor_hol',k)}catch(e){}applyHol();openHol()};c.append(b)});
 c.append(el('div','sub','Тема меняет цвета и добавляет падающие украшения только у тебя. Хэллоуин: 24 окт – 1 нояб, Новый год: 15 дек – 10 янв, Пасха (православная): ±4 дня, 9 Мая: 5–10 мая, 8 Марта: 4–9 марта.'))})}
$('#hol').onclick=openHol;applyHol();

 c.append(el('div','sub','Чёрно-белая тема делает весь интерфейс монохромным.'))})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---- звонки (WebRTC, сигналы через Firestore) ---- */
let pc=null,stream=null,peer=null,pend=[],inc=null,vSender=null,camT=null,scrT=null,tInt=null,t0=0,up=false,micOff=false,stops=[];
const sig=(to,d)=>addDoc(collection(db,'users',to,'signals'),{from:uid,d:JSON.stringify(d),ts:Date.now()}).catch(()=>{});
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function watch(ms,cb){try{const c=ctx(),src=c.createMediaStreamSource(ms),an=c.createAnalyser();an.fftSize=256;src.connect(an);const b=new Uint8Array(an.frequencyBinCount);let run=true;
 (function tick(){if(!run)return;an.getByteFrequencyData(b);let s=0;for(const v of b)s+=v;cb(s/b.length>12);requestAnimationFrame(tick)})();
 return()=>{run=false;try{src.disconnect()}catch(e){}}}catch(e){return()=>{}}}
function ui(status,incoming,id){
 const C=$('#call');C.style.display='flex';C.classList.toggle('incoming',!!incoming);if(incoming)C.classList.remove('min');
 const f=friends.get(id)||{name:'?'};applyName($('#cname'),id,f.name);$('#cs').textContent=status;
 const a=$('#cav');a.textContent='';a.append(avEl(id,f.name,'xl nc'+(incoming||status.startsWith('Звоним')?' ring':'')));
 const s=$('#sav');s.textContent='';s.append(avEl(uid,me,'lg nc'));
}
function started(){stopRing();if(up)return;up=true;t0=Date.now();ui('00:00',false,peer);
 tInt=setInterval(()=>{const t=fmt(Math.floor((Date.now()-t0)/1000));$('#cs').textContent=t;$('#ptimer').textContent=t},1000);
 if(camT||scrT)sig(peer,{k:'vid',on:true,scr:!!scrT})}
async function applyVideo(){
 const t=scrT||camT||null;if(vSender)try{await vSender.replaceTrack(t)}catch(e){}
 const lv=$('#lv');if(t){lv.srcObject=new MediaStream([t]);lv.style.display='block';$('#sav').style.display='none'}else{lv.srcObject=null;lv.style.display='none';$('#sav').style.display='block'}
 $('#ccam').classList.toggle('on',!!camT);$('#cscr').classList.toggle('on',!!scrT);
 if(up&&peer)sig(peer,{k:'vid',on:!!t,scr:!!scrT})}
async function startCam(){const s=await navigator.mediaDevices.getUserMedia({video:true});camT=s.getVideoTracks()[0];await applyVideo()}
async function toggleCam(){if(!pc)return;if(camT){camT.stop();camT=null;return applyVideo()}
 try{await startCam()}catch(e){toast('Нет доступа к камере')}}
async function toggleScr(){if(!pc)return;if(scrT){scrT.stop();scrT=null;return applyVideo()}
 try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});scrT=s.getVideoTracks()[0];scrT.onended=()=>{if(scrT){scrT=null;applyVideo()}}}catch(e){return}
 await applyVideo()}
async function setup(){
 stream=await navigator.mediaDevices.getUserMedia({audio:true});
 pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 stream.getAudioTracks().forEach(t=>pc.addTrack(t,stream));
 vSender=pc.addTransceiver('video',{direction:'sendrecv',streams:[stream]}).sender;
 pc.ontrack=e=>{const r=$('#rv'),s=e.streams[0];if(!s)return;if(r.srcObject!==s)r.srcObject=s;
  if(e.track.kind==='audio')stops.push(watch(s,x=>$('#cav').classList.toggle('speak',x)))};
 pc.onicecandidate=e=>e.candidate&&sig(peer,{k:'ice',c:e.candidate.toJSON()});
 pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState==='connected')started();if(pc.connectionState==='failed')end(true)};
 micOff=false;$('#cmic').classList.remove('off');$('#cmic').textContent='🎤';
 stops.push(watch(stream,x=>$('#self').classList.toggle('speak',x&&!micOff)));
 await applyVideo()}
async function flush(){for(const c of pend)try{await pc.addIceCandidate(c)}catch(e){}pend=[]}
async function call(v){
 if(pc||inc||!cur)return;peer=cur;
 try{await setup();if(v)await startCam()}catch(e){alert('Нет доступа к микрофону/камере: '+e.message);end(false);return}
 const o=await pc.createOffer();await pc.setLocalDescription(o);
 sig(peer,{k:'offer',sdp:pc.localDescription.toJSON(),video:v});ui('Звоним…',false,peer);startRing(snd.back)}
async function accept(){
 stopRing();ui('Соединяем…',false,peer);
 try{await setup();if(inc.video)await startCam()}catch(e){alert('Нет доступа к микрофону/камере: '+e.message);end(true);return}
 await pc.setRemoteDescription(inc.sdp);await flush();
 const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(peer,{k:'answer',sdp:pc.localDescription.toJSON()});inc=null}
function end(n){stopRing();const C=$('#call');if(C.style.display==='flex')snd.end();
 if(n&&peer)sig(peer,{k:'bye'});
 clearInterval(tInt);tInt=null;up=false;stops.forEach(f=>f());stops=[];
 pc&&pc.close();pc=null;vSender=null;stream&&stream.getTracks().forEach(t=>t.stop());camT&&camT.stop();scrT&&scrT.stop();stream=camT=scrT=null;
 peer=null;inc=null;pend=[];C.style.display='none';C.classList.remove('rvid','min','incoming');$('#cpill').style.display='none';
 $('#rv').srcObject=null;$('#lv').srcObject=null;$('#cav').classList.remove('speak');$('#self').classList.remove('speak');
 if(document.fullscreenElement)document.exitFullscreen()}
async function onSig(from,d){
 if(!friends.has(from))return;
 if(d.k==='offer'){if(pc||inc){sig(from,{k:'bye'});return}inc={sdp:d.sdp,video:d.video};peer=from;ui(d.video?'Входящий видеозвонок…':'Входящий звонок…',true,from);startRing(snd.ring)}
 else if(from!==peer)return;
 else if(d.k==='answer'&&pc){stopRing();await pc.setRemoteDescription(d.sdp);await flush()}
 else if(d.k==='ice'){if(pc&&pc.remoteDescription)try{await pc.addIceCandidate(d.c)}catch(e){}else pend.push(d.c)}
 else if(d.k==='vid')$('#call').classList.toggle('rvid',!!d.on);
 else if(d.k==='bye')end(false)}
$('#ca').onclick=()=>call(false);$('#cv').onclick=()=>call(true);$('#acc').onclick=accept;$('#end').onclick=()=>end(true);$('#dec').onclick=()=>end(true);
$('#cmic').onclick=()=>{micOff=!micOff;stream&&stream.getAudioTracks().forEach(t=>t.enabled=!micOff);$('#cmic').classList.toggle('off',micOff);$('#cmic').textContent=micOff?'🔇':'🎤'};
$('#ccam').onclick=toggleCam;$('#cscr').onclick=toggleScr;
$('#cfs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():$('#call').requestFullscreen&&$('#call').requestFullscreen()};
$('#cmin').onclick=()=>{$('#call').classList.add('min');$('#cpill').style.display='flex'};
$('#cpill').onclick=()=>{$('#call').classList.remove('min');$('#cpill').style.display='none'};
if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)$('#cscr').style.display='none';
(function(){const m=$('#menu'),d=$('#dots'),close=()=>{m.classList.remove('open');d.classList.remove('on')};
 d.onclick=e=>{e.stopPropagation();d.classList.toggle('on',m.classList.toggle('open'))};
 m.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.id!=='mute'&&b.id!=='theme')close()});
 document.addEventListener('click',e=>{if(!e.target.closest('#menu'))close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()})})();
{const t=(()=>{try{return localStorage.getItem('egor_theme')}catch(e){return null}})();if(t)document.documentElement.dataset.theme=t}
$('#theme').onclick=openTheme;
</script>
