<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b14">
  <title>Egor Messenger</title>
  <style>
    :root {
      --bg: #090b14;
      --panel: #0d101b;
      --panel-2: #111522;
      --panel-3: #171a27;
      --line: #222635;
      --line-soft: rgba(255,255,255,.07);
      --text: #f4f5fb;
      --muted: #8990a8;
      --muted-2: #626a83;
      --purple: #7040ee;
      --purple-2: #8a42ef;
      --green: #0bb88e;
      --blue: #36bdf4;
      --pink: #ef3d91;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;
      background:
        radial-gradient(circle at 80% -20%, rgba(90, 61, 190, .12), transparent 35%),
        var(--bg);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      width: 328px;
      min-width: 328px;
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, #0d101a 0%, #0b0e17 100%);
    }

    .side-header {
      padding: 18px 18px 12px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 42px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #9b42f5, #642df0);
      box-shadow: 0 7px 22px rgba(119, 58, 242, .38);
      font-size: 21px;
      font-weight: 800;
    }

    .brand {
      flex: 1;
      line-height: 1;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .brand small {
      display: block;
      margin-top: 5px;
      color: #8b7de1;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .03em;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      font-size: 18px;
      transition: .18s ease;
    }

    .icon-btn:hover {
      color: white;
      background: var(--panel-3);
    }

    .quick-contacts {
      display: flex;
      gap: 11px;
      padding: 9px 9px 16px;
      overflow-x: auto;
    }

    .quick-contacts::-webkit-scrollbar { display: none; }

    .quick {
      flex: 0 0 52px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    .quick span {
      display: grid;
      place-items: center;
      width: 47px;
      height: 47px;
      margin: auto auto 6px;
      border: 2px solid #5a3fe9;
      border-radius: 50%;
      color: white;
      background: #3d35a9;
      font-size: 15px;
      font-weight: 700;
    }

    .quick.add span {
      border: 1px dashed #5f6680;
      color: #878ca5;
      background: transparent;
      font-size: 23px;
      font-weight: 400;
    }

    .quick:nth-child(3) span { border-color: #08b8ec; background: #0b9bbd; }
    .quick:nth-child(4) span { border-color: #e7338c; background: #ca3b86; }
    .quick:nth-child(5) span { border-color: #09c9a7; background: #0eae83; }

    .search-wrap {
      position: relative;
      padding: 0 14px 10px;
    }

    .search-wrap svg {
      position: absolute;
      left: 26px;
      top: 12px;
      color: var(--muted);
    }

    .search {
      width: 100%;
      height: 40px;
      padding: 0 14px 0 39px;
      border: 0;
      border-radius: 13px;
      outline: 0;
      color: var(--text);
      background: #1a1d2b;
    }

    .search::placeholder { color: #81889f; }

    .filters {
      display: flex;
      gap: 5px;
      margin: 0 14px 10px;
      padding: 4px;
      border-radius: 10px;
      background: #181b29;
    }

    .filter {
      flex: 1;
      padding: 8px 5px;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      font-weight: 700;
    }

    .filter.active {
      color: white;
      background: #5640e7;
    }

    .chat-list {
      flex: 1;
      overflow: auto;
      border-top: 1px solid var(--line-soft);
      padding: 7px 7px 14px;
    }

    .chat-list::-webkit-scrollbar,
    .messages::-webkit-scrollbar { width: 5px; }

    .chat-list::-webkit-scrollbar-thumb,
    .messages::-webkit-scrollbar-thumb {
      border-radius: 9px;
      background: #2a2e40;
    }

    .chat {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      min-height: 70px;
      padding: 9px 10px;
      border-radius: 15px;
      text-align: left;
      background: transparent;
      transition: .16s ease;
    }

    .chat:hover { background: #161a27; }

    .chat.active {
      color: white;
      background: linear-gradient(110deg, #6341ed, #8539e7);
      box-shadow: 0 7px 20px rgba(100, 58, 232, .19);
    }

    .avatar {
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 49px;
      width: 49px;
      height: 49px;
      border-radius: 50%;
      color: white;
      background: #6849dc;
      font-size: 15px;
      font-weight: 700;
    }

    .avatar.green { background: #08a984; }
    .avatar.cyan { background: #08a4c5; }
    .avatar.pink { background: #db3b8e; }
    .avatar.orange { background: #cf6541; }

    .avatar.online::after {
      content: "";
      position: absolute;
      right: -1px;
      bottom: 1px;
      width: 11px;
      height: 11px;
      border: 2px solid var(--panel);
      border-radius: 50%;
      background: #08bd8d;
    }

    .chat.active .avatar.online::after { border-color: #7040ee; }

    .chat-body {
      min-width: 0;
      flex: 1;
    }

    .chat-top,
    .chat-bottom {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-top strong {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .chat-top time {
      color: var(--muted);
      font-size: 11px;
    }

    .chat.active .chat-top time { color: #e4dcff; }

    .preview {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .chat.active .preview { color: #e9e3ff; }

    .pin {
      color: var(--muted-2);
      font-size: 13px;
    }

    .main {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
    }

    .conversation-head {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 64px;
      padding: 8px 17px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 14, 23, .82);
    }

    .back {
      display: none;
    }

    .conversation-user {
      display: flex;
      align-items: center;
      gap: 11px;
      flex: 1;
      min-width: 0;
    }

    .conversation-user .avatar {
      flex-basis: 42px;
      width: 42px;
      height: 42px;
    }

    .user-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 800;
    }

    .user-status {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .head-actions {
      display: flex;
      gap: 3px;
    }

    .head-actions .icon-btn { font-size: 17px; }

    .messages {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 9px;
      overflow: auto;
      padding: 24px 28px;
      background-color: #0b0e18;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(90, 83, 174, .08) 1px, transparent 1px),
        radial-gradient(circle at 80% 80%, rgba(90, 83, 174, .07) 1px, transparent 1px);
      background-size: 34px 34px, 47px 47px;
    }

    .day {
      align-self: center;
      margin: 0 0 5px;
      padding: 6px 13px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: #a1a8be;
      background: #151927;
      font-size: 11px;
      font-weight: 700;
    }

    .message-row {
      display: flex;
      max-width: 72%;
    }

    .message-row.mine {
      align-self: flex-end;
    }

    .message {
      position: relative;
      padding: 10px 13px 7px;
      border: 1px solid #292e40;
      border-radius: 17px 17px 17px 4px;
      color: #e9ebf6;
      background: #151927;
      box-shadow: 0 3px 9px rgba(0,0,0,.12);
      font-size: 14px;
      line-height: 1.48;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .mine .message {
      border: 0;
      border-radius: 17px 17px 4px 17px;
      background: linear-gradient(135deg, #7440eb, #833ce8);
      box-shadow: 0 5px 18px rgba(92, 48, 210, .26);
    }

    .message-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      color: #8790aa;
      font-size: 10px;
    }

    .mine .message-meta { color: #ddd4fa; }

    .reaction {
      align-self: flex-start;
      margin-top: -6px;
      padding: 3px 8px;
      border: 1px solid #30364a;
      border-radius: 12px;
      color: #dce1f7;
      background: #151927;
      font-size: 12px;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 76px;
      padding: 13px 22px 16px;
      border-top: 1px solid var(--line);
      background: #0d101a;
    }

    .compose-button {
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #8991a9;
      background: transparent;
      font-size: 21px;
    }

    .compose-button:hover {
      color: white;
      background: #1b1f2e;
    }

    .input-shell {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 8px 0 15px;
      border-radius: 15px;
      background: #1b1e2b;
    }

    .message-input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      color: white;
      background: transparent;
      font-size: 14px;
    }

    .message-input::placeholder { color: #858da4; }

    .emoji-btn {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: #80889f;
      background: transparent;
      font-size: 20px;
    }

    .send-button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: white;
      background: #6841e8;
      font-size: 17px;
      transition: .16s ease;
    }

    .send-button:hover {
      transform: scale(1.06);
      background: #8050f3;
    }

    .empty {
      display: none;
      place-items: center;
      flex: 1;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 720px) {
      .sidebar {
        width: 100%;
        min-width: 100%;
      }

      .main {
        display: none;
      }

      .app.chat-open .sidebar { display: none; }
      .app.chat-open .main { display: flex; }

      .back {
        display: grid;
        flex: 0 0 34px;
      }

      .messages {
        padding: 18px 13px;
      }

      .message-row {
        max-width: 86%;
      }

      .composer {
        padding: 10px 10px max(10px, env(safe-area-inset-bottom));
      }

      .head-actions .icon-btn:nth-child(2) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <header class="side-header">
        <div class="brand-row">
          <div class="logo">E</div>
          <div class="brand">
            Egor
            <small>MESSENGER</small>
          </div>
          <button class="icon-btn" title="Тема" id="themeBtn">☼</button>
          <button class="icon-btn" title="Новый чат" id="newChatBtn">□</button>
        </div>

        <div class="quick-contacts">
          <button class="quick add" data-chat="new"><span>+</span>Вы</button>
          <button class="quick" data-chat="alina"><span>АС</span>Алина</button>
          <button class="quick" data-chat="max"><span>МК</span>Максим</button>
          <button class="quick" data-chat="elena"><span>ЕЛ</span>Елена</button>
          <button class="quick" data-chat="dmitry"><span>ДВ</span>Дмитрий</button>
        </div>

        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
          </svg>
          <input class="search" id="search" placeholder="Поиск людей, групп, сообщений...">
        </div>

        <div class="filters">
          <button class="filter active">Все</button>
          <button class="filter">Личные</button>
          <button class="filter">Группы</button>
          <button class="filter">Каналы</button>
        </div>
      </header>

      <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main">
      <header class="conversation-head">
        <button class="icon-btn back" id="backBtn">‹</button>

        <div class="conversation-user">
          <div class="avatar green online" id="headAvatar">ДВ</div>
          <div>
            <div class="user-name" id="headName">Дмитрий Волков</div>
            <div class="user-status" id="headStatus">был(а) 35 минут назад</div>
          </div>
        </div>

        <div class="head-actions">
          <button class="icon-btn" title="Поиск">⌕</button>
          <button class="icon-btn" title="Позвонить">♧</button>
          <button class="icon-btn" title="Видеозвонок">▣</button>
          <button class="icon-btn" title="Информация">◫</button>
        </div>
      </header>

      <section class="messages" id="messages"></section>

      <form class="composer" id="composer">
        <button class="compose-button" type="button" title="Прикрепить файл">⌕</button>

        <div class="input-shell">
          <input class="message-input" id="messageInput" autocomplete="off" placeholder="Написать сообщение...">
          <button class="emoji-btn" type="button" id="emojiBtn">☺</button>
        </div>

        <button class="compose-button" type="button" title="Голосовое сообщение">♩</button>
        <button class="send-button" type="submit" title="Отправить">➤</button>
      </form>
    </main>
  </div>

  <script>
    const chats = {
      dmitry: {
        name: "Дмитрий Волков",
        initials: "ДВ",
        color: "green",
        status: "был(а) 35 минут назад",
        time: "14:12",
        preview: "Да, конечно, через полчаса буду за ноутом...",
        messages: [
          { text: "Дима, привет! Скинешь конфиг Tailwind?", time: "14:05", mine: true },
          { text: "Да, конечно, через полчаса буду за ноутом и отправлю!", time: "14:12", mine: false, reaction: "👍 1" }
        ]
      },
      alina: {
        name: "Алина Смирнова",
        initials: "АС",
        color: "",
        status: "в сети",
        time: "18:24",
        preview: "Попробуй навести на любое сообщение...",
        messages: [
          { text: "Привет! Попробуй навести на любое сообщение, там появились новые действия.", time: "18:24", mine: false }
        ]
      },
      dev: {
        name: "Команда Разработки 🚀",
        initials: "DEV",
        color: "cyan",
        status: "5 участников онлайн",
        time: "17:45",
        preview: "Плавность анимаций просто космос...",
        messages: [
          { text: "Плавность анимаций просто космос, Egor выглядит очень аккуратно.", time: "17:45", mine: false }
        ]
      },
      design: {
        name: "Дизайн и Технологии",
        initials: "DT",
        color: "",
        status: "4 участника онлайн",
        time: "15:30",
        preview: "Тренды веб-интерфейсов 2026",
        messages: [
          { text: "Тренды веб-интерфейсов 2026 уже обсуждаем в канале.", time: "15:30", mine: false }
        ]
      },
      cinema: {
        name: "Киноклуб по пятницам 🍿",
        initials: "К",
        color: "pink",
        status: "был(а) вчера",
        time: "Вчера",
        preview: "Ну что, в эту пятницу смотрим научн...",
        messages: [
          { text: "Ну что, в эту пятницу смотрим научную фантастику?", time: "Вчера", mine: false }
        ]
      },
      max: {
        name: "Максим Кузнецов",
        initials: "МК",
        color: "cyan",
        status: "был(а) недавно",
        time: "12:40",
        preview: "Отправил тебе новый макет",
        messages: [
          { text: "Отправил тебе новый макет. Посмотри, когда будет время.", time: "12:40", mine: false }
        ]
      },
      elena: {
        name: "Елена Петрова",
        initials: "ЕЛ",
        color: "pink",
        status: "в сети",
        time: "11:25",
        preview: "Спасибо, всё получилось!",
        messages: [
          { text: "Спасибо, всё получилось!", time: "11:25", mine: false }
        ]
      }
    };

    let activeChat = "dmitry";
    const app = document.getElementById("app");
    const chatList = document.getElementById("chatList");
    const messages = document.getElementById("messages");
    const search = document.getElementById("search");
    const composer = document.getElementById("composer");
    const messageInput = document.getElementById("messageInput");

    function avatar(chat, large = false) {
      return '<div class="avatar ' + chat.color + (chat.status === "в сети" ? " online" : "") + (large ? " large" : "") + '">' + chat.initials + '</div>';
    }

    function renderChatList(filter = "") {
      const query = filter.trim().toLowerCase();

      chatList.innerHTML = Object.entries(chats)
        .filter(([_, chat]) =>
          !query ||
          chat.name.toLowerCase().includes(query) ||
          chat.preview.toLowerCase().includes(query)
        )
        .map(([id, chat]) => `
          <button class="chat ${id === activeChat ? "active" : ""}" data-chat-id="${id}">
            ${avatar(chat)}
            <div class="chat-body">
              <div class="chat-top">
                <strong>${chat.name}</strong>
                <time>${chat.time}</time>
              </div>
              <div class="chat-bottom">
                <span class="preview">${chat.preview}</span>
                ${id === "dmitry" ? '<span class="pin">⌖</span>' : ""}
              </div>
            </div>
          </button>
        `).join("");

      chatList.querySelectorAll(".chat").forEach(button => {
        button.addEventListener("click", () => openChat(button.dataset.chatId));
      });
    }

    function renderMessages() {
      const chat = chats[activeChat];

      document.getElementById("headAvatar").className =
        "avatar " + chat.color + (chat.status === "в сети" ? " online" : "");
      document.getElementById("headAvatar").textContent = chat.initials;
      document.getElementById("headName").textContent = chat.name;
      document.getElementById("headStatus").textContent = chat.status;

      messages.innerHTML = '<div class="day">Сегодня</div>' + chat.messages.map(message => `
        <div class="message-row ${message.mine ? "mine" : ""}">
          <div>
            <div class="message">
              ${escapeHtml(message.text)}
              <div class="message-meta">
                <span>${message.time}</span>
                ${message.mine ? "<span>✓✓</span>" : ""}
              </div>
            </div>
            ${message.reaction ? `<div class="reaction">${message.reaction}</div>` : ""}
          </div>
        </div>
      `).join("");

      messages.scrollTop = messages.scrollHeight;
    }

    function openChat(id) {
      if (!chats[id]) return;
      activeChat = id;
      app.classList.add("chat-open");
      renderChatList(search.value);
      renderMessages();
      messageInput.focus();
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    composer.addEventListener("submit", event => {
      event.preventDefault();

      const value = messageInput.value.trim();
      if (!value) return;

      const now = new Date();
      const time = now.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });

      chats[activeChat].messages.push({
        text: value,
        time,
        mine: true
      });

      chats[activeChat].preview = value;
      chats[activeChat].time = time;

      messageInput.value = "";
      renderChatList(search.value);
      renderMessages();
    });

    search.addEventListener("input", () => renderChatList(search.value));

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
      });
    });

    document.querySelectorAll(".quick[data-chat]").forEach(button => {
      button.addEventListener("click", () => {
        const id = button.dataset.chat;
        if (id === "new") {
          const name = prompt("Имя нового контакта");
          if (!name) return;

          const newId = "new-" + Date.now();
          chats[newId] = {
            name,
            initials: name.slice(0, 2).toUpperCase(),
            color: "",
            status: "новый контакт",
            time: "сейчас",
            preview: "Новый чат",
            messages: []
          };
          openChat(newId);
          return;
        }

        openChat(id);
      });
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      app.classList.remove("chat-open");
    });

    document.getElementById("emojiBtn").addEventListener("click", () => {
      messageInput.value += " 🙂";
      messageInput.focus();
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      document.body.classList.toggle("light");
      if (document.body.classList.contains("light")) {
        document.documentElement.style.setProperty("--bg", "#eef0f7");
        document.documentElement.style.setProperty("--panel", "#f7f8fc");
        document.documentElement.style.setProperty("--panel-2", "#ffffff");
        document.documentElement.style.setProperty("--panel-3", "#e8eaf2");
        document.documentElement.style.setProperty("--line", "#dfe2ed");
        document.documentElement.style.setProperty("--text", "#171925");
        document.documentElement.style.setProperty("--muted", "#687087");
      } else {
        location.reload();
      }
    });

    document.getElementById("newChatBtn").addEventListener("click", () => {
      document.querySelector('.quick[data-chat="new"]').click();
    });

    renderChatList();
    renderMessages();
  </script>
</body>
</html>
